<ng-template #card let-p
  ><app-entity-card
    [title]="p.name"
    description="طرف مرتبط بالمعاملة"
    [icon]="p.kind === 'فرد' ? 'phosphorUsers' : 'phosphorTreeStructure'"
    ><app-key-values
      [items]="[
        { label: 'الصفة', value: p.kind },
        { label: 'رقم المرجع', value: p.identifier },
      ]"
    /><button card-actions hlmBtn type="button" variant="outline" (click)="inspect('party', p.id)">
      عرض
    </button></app-entity-card
  ></ng-template
>
@if (t.parties.length) {
  <app-collection-view
    label="الأطراف والوكالات"
    [data]="t.parties"
    [columns]="personColumns"
    [getRowId]="getId"
    [card]="card"
    [actions]="partyActions"
  />
} @else {
  <app-empty-state
    title="لا توجد أطراف مرتبطة"
    description="هذه المعاملة تخص مقدم الطلب مباشرة ولا تتضمن وكالة إضافية."
    icon="phosphorTreeStructure"
  />
}
