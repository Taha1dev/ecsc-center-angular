@if (toast.message()) {
  <div
    role="status"
    aria-live="polite"
    [class]="
      'fixed bottom-5 start-5 z-[1000] max-w-[calc(100vw-2.5rem)] rounded-panel border bg-card px-5 py-4 text-sm shadow-float ' +
      (toast.error() ? 'text-danger' : 'text-foreground')
    "
  >
    {{ toast.message() }}
  </div>
}
