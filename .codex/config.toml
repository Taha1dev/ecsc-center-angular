# Project-local MCP servers. No API keys or user-level configuration are stored here.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 90

[mcp_servers.angular-cli]
command = "node"
args = ["scripts/mcp-server.mjs", "angular-cli"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 180

[mcp_servers.spartan-ui]
command = "node"
args = ["scripts/mcp-server.mjs", "spartan-ui"]
enabled = true
startup_timeout_sec = 120
tool_timeout_sec = 120
